version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint does not run on TypeScript 7 yet, so the bump fails
      # lint. Remove this once typescript-eslint supports it:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # The PR title becomes the squash commit, and release.yml reads its type.
    # A bump to a runtime dependency is a `fix`, so it cuts a patch release;
    # a dev-only bump is a `chore` and releases nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
      typescript:
        patterns:
          - "typescript"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      styles:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
          - "autoprefixer"
          - "postcss"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # The PR title becomes the squash commit, and release.yml reads its type.
    # A bump to a runtime dependency is a `fix`, so it cuts a patch release;
    # a dev-only bump is a `chore` and releases nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Workflow-only changes never need a release.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # codeql-action/init and codeql-action/analyze are separate dependencies
      # to Dependabot but a single unit at runtime: they negotiate through a
      # shared config file, so a version skew fails the run with
      #   Loaded a configuration file for version 'X', but running version 'Y'
      # Ungrouped, every release arrives as two PRs that each fail on their own
      # and have to be combined by hand -- done three times already, in #99,
      # #124 and #133.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - ci
