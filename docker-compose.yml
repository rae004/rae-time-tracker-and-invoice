services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/rae_time_tracker
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://api:5000
      # The /app/node_modules anonymous volume below persists across
      # container restarts, so a Dependabot bump (or any host-side
      # `pnpm install`) leaves it out of sync with pnpm-lock.yaml. On the
      # next `docker compose up`, pnpm's pre-run deps-status check wants
      # to wipe and reinstall node_modules and aborts because no TTY is
      # attached. CI=true tells pnpm to skip the confirmation prompt and
      # rebuild silently. Tradeoff: `pnpm add` from inside the container
      # will refuse to update the lockfile under CI mode — install deps
      # from the host instead.
      - CI=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rae_time_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
